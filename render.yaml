# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Two services:
#   rag-chat-api  : FastAPI backend. SQLite + Chroma live on a persistent disk.
#   rag-chat-web  : React build served as a static site.
#
# Deploy: push this repo to GitHub, then Render Dashboard > New > Blueprint.
# You will be prompted for GROQ_API_KEY and VITE_API_URL (both marked sync:false).
#
# Everything here is FREE tier — no card required to apply this blueprint.
# The cost of that is stated under "What free costs you" at the bottom. Read it
# before demoing: uploaded documents do not survive a spin-down.

services:
  # ---------------------------------------------------------------- backend --
  - type: web
    name: rag-chat-api
    runtime: python
    plan: free # no disk, spins down after 15 min idle — see the note at the bottom
    region: oregon
    branch: main
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true

    # No `disk:` block — persistent disks are a paid-only feature, and adding
    # one is what makes Render demand a card before applying this blueprint.
    # SQLite, Chroma, uploads and the ONNX model therefore live in the
    # container's ephemeral filesystem and are lost on restart.

    envVars:
      # Set this in the Render dashboard — never commit the key.
      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      # DATA_DIR deliberately unset. config.py then falls back to
      # backend/data/, inside the container. Setting it to /var/data with no
      # disk mounted would still "work" but buys nothing.

      # onnxruntime (used for local embeddings) is happiest on 3.11.
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: CHUNK_SIZE
        value: 1000
      - key: CHUNK_OVERLAP
        value: 150
      - key: TOP_K
        value: 4
      # Retrieved chunks below this cosine similarity are discarded, so an
      # off-topic question reports 0 sources instead of 4 irrelevant ones.
      - key: MIN_SIMILARITY
        value: 0.25
      - key: MAX_UPLOAD_MB
        value: 20

      # Lock this down to the static site's URL once you know it, e.g.
      # https://rag-chat-web.onrender.com
      - key: CORS_ORIGINS
        value: "*"

  # --------------------------------------------------------------- frontend --
  - type: web
    name: rag-chat-web
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true

    envVars:
      # Full https URL of the API service above, e.g.
      # https://rag-chat-api.onrender.com
      # Render prompts for this at deploy time.
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: 20.11.1

    routes:
      # SPA fallback so client-side routing and refreshes work.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

# ---------------------------------------------------------------------------
# What free costs you
# ---------------------------------------------------------------------------
# 1. NOTHING PERSISTS. Uploaded documents, their embeddings and the chat
#    history are wiped on every deploy AND every spin-down. The app comes back
#    with an empty corpus and answers "0 sources" until you re-upload.
# 2. SPIN-DOWN AFTER 15 MIN IDLE. The next request cold-starts the container,
#    which takes roughly 50s before it answers.
# 3. THE EMBEDDING MODEL RE-DOWNLOADS. vectorstore.py caches Chroma's ~80MB
#    ONNX MiniLM under the data dir, which is ephemeral here, so it is
#    re-fetched after each cold start. The first upload or question after a
#    spin-down pays that download on top of the 50s.
# 4. 512MB RAM. chromadb + onnxruntime + FastAPI fit, but not with much room.
#    A large PDF near the 20MB MAX_UPLOAD_MB limit can OOM the instance during
#    embedding; the process restarts and, per (1), you lose the corpus.
#
# DEMOING THIS: open the site and upload your documents a few minutes before
# you present, then keep a tab making requests. An idle gap mid-presentation
# wipes the corpus and the recovery is a ~50s cold start plus a re-upload.
#
# ---------------------------------------------------------------------------
# Going back to paid (removes every limitation above, ~$7.25/mo)
# ---------------------------------------------------------------------------
#   1. change `plan: free` back to `plan: starter`
#   2. restore the disk block on the backend service:
#        disk:
#          name: rag-data
#          mountPath: /var/data
#          sizeGB: 1
#   3. add the env var DATA_DIR=/var/data so SQLite, Chroma, uploads and the
#      ONNX model cache all land on the mounted disk
# Render will then ask for a card at apply time — that prompt is the disk and
# the Starter instance, and it is unavoidable on paid resources.
